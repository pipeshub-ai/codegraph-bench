# B7: this branch on local Docker Compose, beside other sessions' stacks on the same machine.
# Own image tag, host ports bound to localhost only, Neo4j bolt published for the scorer,
# and the code sandbox left off (B3 does not run code).
services:
  pipeshub-ai:
    image: pipeshub-ai:cg-b7
    ports: !override
      - "127.0.0.1:3950:3000"
    depends_on: !override
      qdrant:
        condition: service_healthy
      redis:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      neo4j:
        condition: service_healthy
  docker-socket-proxy:
    image: pipeshub-ai:cg-b7
    profiles: ["off"]
  sandbox-image:
    profiles: ["off"]
  neo4j:
    ports:
      - "127.0.0.1:47687:7687"
      - "127.0.0.1:47474:7474"
  # B7: lets the Jira Data Center connector read Apache's public Jira (see jira_proxy.py).
  jira-proxy:
    image: python:3.12-slim
    command: ["python", "/p/jira_proxy.py"]
    volumes:
      - ${B7_DIR}/jira_proxy.py:/p/jira_proxy.py:ro
    restart: unless-stopped
